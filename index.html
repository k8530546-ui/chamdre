<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>참드레 프로그램</title><link rel="manifest" href="manifest.webmanifest"><meta name="theme-color" content="#2c6a4f"><link rel="icon" href="icon.svg"><link rel="apple-touch-icon" href="icon.svg">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.49.4/dist/umd/supabase.js"></script><script src="js/cloud-config.js"></script><script src="js/pc-cloud.js"></script>
<style>
:root{--bg:#eef3ef;--card:#fff;--ink:#1a2420;--sub:#5b6a63;--line:#d6ded8;--pri:#2c6a4f}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:"Malgun Gothic","Apple SD Gothic Neo",sans-serif}
main{max-width:560px;margin:0 auto;padding:20px 16px 40px}
h1{font-size:22px;margin:8px 0 4px}.sub{color:var(--sub);font-size:14px;margin:0 0 16px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.sub button{font:inherit;font-size:13px;border:1px solid var(--line);background:#fff;border-radius:6px;padding:4px 10px;cursor:pointer}
.it{display:grid;grid-template-columns:44px 1fr auto;align-items:center;gap:10px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:10px;color:inherit;text-decoration:none;font-size:16px}
.it b{background:var(--pri);color:#fff;border-radius:8px;text-align:center;padding:6px 0;font-size:14px}.it i{font-style:normal;color:var(--sub);font-size:12px}
.it:active{background:#f3f7f4}.tip{color:var(--sub);font-size:13px;line-height:1.6;margin-top:20px}.tip a{color:var(--pri)}
.warn{background:#fff4e5;border:1px solid #f0c789;border-radius:10px;padding:12px;font-size:14px;line-height:1.6}
</style></head><body><main>
<h1>참드레 프로그램</h1>
<p class="sub"><span id="who">로그인 확인 중…</span><button id="out" hidden>로그아웃</button></p>
<div id="list" hidden>
<a class="it" href="01/"><b>01</b><span>가락시장 구매분석</span><i>프로그램</i></a>
<a class="it" href="02/"><b>02</b><span>클레임 접수 프로그램</span><i>프로그램</i></a>
<a class="it" href="05/"><b>05</b><span>익산 판매동향 보고서</span><i>프로그램</i></a>
<a class="it" href="09/"><b>09</b><span>엽채 구매분석</span><i>프로그램</i></a>
<a class="it" href="10/"><b>10</b><span>참드레 입고검수</span><i>프로그램</i></a>
<a class="it" href="11/"><b>11</b><span>참드레 시세표</span><i>프로그램</i></a>
<a class="it" href="13/"><b>13</b><span>순천 판매동향 보고서</span><i>프로그램</i></a>
<a class="it" href="14/"><b>14</b><span>익산경매 수익률 계산기</span><i>프로그램</i></a>
<a class="it" href="15/"><b>15</b><span>새벽 입고 확인</span><i>프로그램</i></a>
</div>
<p class="tip">📱 폰 홈 화면에 추가하면 앱처럼 쓸 수 있어요 (브라우저 메뉴 → 홈 화면에 추가).<br>💻 PC 자료 올리기·백업은 PC 크롬에서 <a href="tools/">자료 옮기기 도구</a>를 쓰세요.</p>
</main>
<script>
(async () => {
  const who = document.getElementById('who');
  if (!window.__pcCloud) { who.innerHTML = '<span class="warn">클라우드 연결 정보가 아직 없습니다 (_pc\\cloud-config.js).</span>'; return; }
  await window.__pcCloud.start();
  let email = '';
  try { const { data } = await window.__pcCloud.client().auth.getSession(); email = (data && data.session && data.session.user && data.session.user.email) || ''; } catch (e) {}
  who.textContent = email ? email + ' 로그인됨' : '로그인됨';
  document.getElementById('list').hidden = false;
  const out = document.getElementById('out'); out.hidden = false;
  out.onclick = async () => { if (confirm('로그아웃할까요?')) { await window.__pcCloud.logout(); location.reload(); } };
})();
</script></body></html>
